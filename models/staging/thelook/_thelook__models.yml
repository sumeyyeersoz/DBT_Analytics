version: 2
models:
- name: stg_thelook__distribution_centers
  description: One row per distribution_center_id from the selected TheLook batch.
    No joins or row deduplication; source nulls are preserved. Geography is retained
    as source text.
  data_tests:
  - batch_row_count_matches:
      arguments:
        source_table: distribution_centers
  columns:
  - name: distribution_center_id
    description: Source distribution_centers.id.
    data_tests:
    - not_null
    - unique
  - name: distribution_center_name
    description: Source distribution_centers.name.
  - name: latitude
    description: Source distribution_centers.latitude.
  - name: longitude
    description: Source distribution_centers.longitude.
  - name: distribution_center_geom
    description: Source distribution_centers.distribution_center_geom.
  - name: source_batch_id
    description: Explicitly selected complete extract batch.
    data_tests:
    - not_null
  - name: extracted_at
    description: Batch extraction timestamp in UTC.
    data_tests:
    - not_null
- name: stg_thelook__events
  description: One row per event_id from the selected TheLook batch. No joins or row
    deduplication; source nulls are preserved. Geography is retained as source text.
  data_tests:
  - batch_row_count_matches:
      arguments:
        source_table: events
  columns:
  - name: event_id
    description: Source events.id.
    data_tests:
    - not_null
    - unique
  - name: customer_id
    description: Source events.user_id.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_thelook__users')
          field: customer_id
  - name: sequence_number
    description: Source events.sequence_number.
  - name: session_id
    description: Source events.session_id.
  - name: created_at
    description: Source events.created_at. UTC timestamp without session timezone
      dependence.
  - name: ip_address
    description: Source events.ip_address.
  - name: city
    description: Source events.city.
  - name: state
    description: Source events.state.
  - name: postal_code
    description: Source events.postal_code.
  - name: browser
    description: Source events.browser.
  - name: traffic_source
    description: Source events.traffic_source.
  - name: uri
    description: Source events.uri.
  - name: event_type
    description: Source events.event_type.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - product
          - cart
          - department
          - purchase
          - cancel
          - home
  - name: source_batch_id
    description: Explicitly selected complete extract batch.
    data_tests:
    - not_null
  - name: extracted_at
    description: Batch extraction timestamp in UTC.
    data_tests:
    - not_null
  - name: is_created_after_extract
    description: Flags a source creation timestamp later than ingestion; rows are
      preserved.
